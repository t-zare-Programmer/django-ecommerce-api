services:

  db:
    image: postgres:16

    env_file:
      - .env.prod

    volumes:
      - postgres_data_prod:/var/lib/postgresql/data


  redis:
    image: redis:7-alpine


  web:
    build:
      context: .
      dockerfile: Dockerfile.prod

    env_file:
      - .env.prod

    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media

    expose:
      - "8000"

    depends_on:
      - db
      - redis


  celery:
    build:
      context: .
      dockerfile: Dockerfile.prod

    command: celery -A shop_center worker -l info

    env_file:
      - .env.prod

    depends_on:
      - db
      - redis


  nginx:
    image: nginx:latest

    ports:
      - "80:80"

    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
      - media_volume:/app/media

    depends_on:
      - web


volumes:
  postgres_data_prod:
  static_volume:
  media_volume: