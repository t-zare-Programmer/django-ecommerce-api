openapi: 3.0.3
info:
  title: ''
  version: 0.0.0
paths:
  /api/products/:
    get:
      operationId: products_list
      description: |2

        Retrieve a paginated list of active products.

        Features:
        - Pagination
        - Search
        - Ordering
        - Brand filtering

        Only active products are returned.
      summary: List active products
      parameters:
      - in: query
        name: brand__brand_title
        schema:
          type: string
        description: Filter products by brand title.
      - in: query
        name: ordering
        schema:
          type: string
        description: 'Order by price or id. Example: price, -price'
      - in: query
        name: page
        schema:
          type: integer
        description: Page number.
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Search by product name or description.
      tags:
      - Products
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductList'
              examples:
                SuccessfulResponse:
                  value:
                    count: 123
                    next: http://api.example.org/accounts/?page=4
                    previous: http://api.example.org/accounts/?page=2
                    results:
                    - success: true
                      message: Products retrieved successfully.
                      data:
                        count: 15
                        next: null
                        previous: null
                        results:
                        - id: 1
                          product_name: Nike Shoes
                          price: '2500'
                  summary: List Products
          description: Products retrieved successfully.
  /api/products/{slug}/:
    get:
      operationId: products_retrieve
      description: Retrieve a product by slug.
      summary: Retrieve Product
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - Products
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
  /api/products/{slug}/delete/:
    delete:
      operationId: products_delete_destroy
      description: Only admin users can delete a product.
      summary: Delete Product
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - Products
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/products/{slug}/update/:
    put:
      operationId: products_update_update
      description: Only admin users can update a product.
      summary: Update Product
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - Products
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Product'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Product'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
    patch:
      operationId: products_update_partial_update
      description: Only admin users can update a product.
      summary: Update Product
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - Products
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProduct'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProduct'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProduct'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
  /api/products/create/:
    post:
      operationId: products_create_create
      description: Only admin users can create a product.
      summary: Create Product
      tags:
      - Products
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Product'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Product'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
  /api/schema/:
    get:
      operationId: schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      - in: query
        name: lang
