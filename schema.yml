  /api/token/:
    post:
      operationId: token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/token/refresh/:
    post:
      operationId: token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
components:
  schemas:
    Brand:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        brand_title:
          type: string
          title: نام برند
          maxLength: 100
        image_name:
          type: string
          format: uri
          nullable: true
        slug:
          type: string
          nullable: true
          maxLength: 200
          pattern: ^[-a-zA-Z0-9_]+$
      required:
      - brand_title
      - id
    PaginatedProductList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Product'
    PatchedProduct:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        product_name:
          type: string
          title: نام کالا
          maxLength: 500
        summery_description:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        image_name:
          type: string
          format: uri
          nullable: true
        price:
          type: integer
          maximum: 2147483647
          minimum: 0
          title: قیمت کالا
        brand:
          $ref: '#/components/schemas/Brand'
        product_group:
          type: array
          items:
            $ref: '#/components/schemas/ProductGroup'
        gallery_images:
          type: array
          items:
            $ref: '#/components/schemas/ProductGallery'
        slug:
          type: string
          nullable: true
          maxLength: 200
          pattern: ^[-a-zA-Z0-9_]+$
        is_active:
          type: boolean
          title: وضعیت فعال/غیرفعال
    Product:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        product_name:
          type: string
          title: نام کالا
          maxLength: 500
        summery_description:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        image_name:
          type: string
          format: uri
          nullable: true
        price:
          type: integer
          maximum: 2147483647
          minimum: 0
          title: قیمت کالا
        brand:
          $ref: '#/components/schemas/Brand'
        product_group:
          type: array
          items:
            $ref: '#/components/schemas/ProductGroup'
        gallery_images:
          type: array
          items:
            $ref: '#/components/schemas/ProductGallery'
        slug:
          type: string
          nullable: true
          maxLength: 200
          pattern: ^[-a-zA-Z0-9_]+$
        is_active:
          type: boolean
          title: وضعیت فعال/غیرفعال
      required:
      - brand
      - id
      - product_group
      - product_name
    ProductGallery:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        image_name:
          type: string
          format: uri
          nullable: true
      required:
      - id
    ProductGroup:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        group_title:
          type: string
          title: عنوان گروه کالا
          maxLength: 100
        slug:
          type: string
          nullable: true
          maxLength: 200
          pattern: ^[-a-zA-Z0-9_]+$
      required:
      - group_title
      - id
    TokenObtainPair:
      type: object
      properties:
        mobile_number:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - mobile_number
      - password
      - refresh
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          writeOnly: true
      required:
      - access
      - refresh
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
