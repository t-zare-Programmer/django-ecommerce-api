services:
  db:
    image: postgres:16

    environment:
      POSTGRES_DB: shop_center
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

    ports:
      - "6379:6379"

  web:
    build: .

    command: python manage.py runserver 0.0.0.0:8000

    volumes:
      - .:/app

    ports:
      - "8000:8000"

    depends_on:
      - db
      - redis

  celery:
    build: .

    command: celery -A shop_center worker -l info

    volumes:
      - .:/app

    depends_on:
      - db
      - redis

    environment:
      - PYTHONUNBUFFERED=1

volumes:
  postgres_data: