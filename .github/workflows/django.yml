name: Django CI

on:
  push:
    branches:
      - main
      - feature/product-service-layer

  pull_request:
    branches:
      - main

jobs:
  test:

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: shop_center
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 12345
        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        env:
          SECRET_KEY: testsecret
          DEBUG: True
          DB_NAME: shop_center
          DB_USER: postgres
          DB_PASSWORD: 12345
          DB_HOST: localhost
          DB_PORT: 5432
          ALLOWED_HOSTS: localhost,127.0.0.1
      
        run: |
          python manage.py migrate
          pytest

      - name: Run Django checks
        env:
          SECRET_KEY: testsecret
          DEBUG: True
          DB_NAME: shop_center
          DB_USER: postgres
          DB_PASSWORD: 12345
          DB_HOST: localhost
          DB_PORT: 5432
          ALLOWED_HOSTS: localhost,127.0.0.1

        run: |
          python manage.py check